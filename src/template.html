<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>__TITLE__</title>
<style>
:root{--accent:#e8552b;--ink:#2b2622;--muted:#8a8178;--bg:#f3efe8;--card:rgba(255,255,255,.86)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
 font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#overlay{position:absolute;inset:0;pointer-events:none}
#lines{position:absolute;inset:0;width:100%;height:100%}
.callout{position:absolute;transform:translate(0,-50%);background:var(--card);border:1px solid rgba(0,0,0,.08);
 border-left:3px solid var(--ink);border-radius:6px;padding:5px 9px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.06);
 opacity:0;transition:opacity .25s}
.callout b{display:block;font-size:14px;font-weight:700}
.callout span{display:block;font-size:12px;color:var(--muted)}
.callout.sel{border-left-color:var(--accent)}
.callout.sel b{color:var(--accent)}
#title{position:absolute;left:18px;top:14px;pointer-events:none}
#title h1{font-size:22px;font-weight:800;letter-spacing:1px}
#title p{font-size:13px;color:var(--muted);margin-top:2px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 14px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
#bar button{font:inherit;font-size:14px;border:1px solid rgba(0,0,0,.12);background:var(--card);color:var(--ink);
 padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.05)}
#bar button small{color:var(--muted);font-size:11px;margin-right:4px}
#bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#bar button.on small{color:rgba(255,255,255,.85)}
#bar button.special{font-weight:700}
#panel{width:300px;flex:none;background:#fbf9f5;border-left:1px solid rgba(0,0,0,.07);padding:22px 20px;overflow:auto}
#panel .tag{display:inline-block;font-size:12px;color:#fff;background:var(--accent);border-radius:4px;padding:1px 7px;margin-bottom:6px}
#panel h2{font-size:24px;font-weight:800;margin-bottom:4px}
#panel .note{color:var(--muted);font-size:13px;margin-bottom:16px}
#panel h3{font-size:12px;letter-spacing:2px;color:var(--muted);margin:14px 0 4px;font-weight:600}
#panel p{font-size:14px;line-height:1.65}
#panel .amt{font-size:18px;font-weight:700;color:var(--accent)}
#panel .approx{font-size:11px;color:var(--muted)}
#panel ul{list-style:none;font-size:13px;line-height:1.9}
#panel ul li i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#tourflag{position:absolute;right:14px;top:14px;font-size:12px;color:var(--muted);background:var(--card);padding:3px 9px;border-radius:999px;opacity:0;transition:opacity .3s}
body.rec .callout,body.rec #tourflag{transition:none}
#hint{position:absolute;left:18px;top:74px;font-size:12px;color:var(--muted)}
@media (max-width:760px),(orientation:portrait){
 #app{flex-direction:column}
 #panel{width:auto;height:34%;border-left:none;border-top:1px solid rgba(0,0,0,.07);padding:12px 16px}
 #panel h2{font-size:19px}#panel .note{margin-bottom:6px}#panel h3{margin:8px 0 2px}
 #bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:8px 10px;-webkit-overflow-scrolling:touch}
 #bar button{font-size:13px;padding:6px 10px}
 #title h1{font-size:17px}#title{left:12px;top:10px}#hint{display:none}
 .callout b{font-size:12px}.callout span{font-size:10px}.callout{padding:3px 6px}
}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay"><svg id="lines"></svg></div>
  <div id="title"><h1>__TITLE__</h1><p>__SUBTITLE__</p></div>
  <div id="hint">拖动旋转 · 滚轮/双指缩放 · 点按钮拆解</div>
  <div id="tourflag">▶ 自动导览中</div>
  <div id="bar"></div>
 </div>
 <aside id="panel"></aside>
</div>
<script>/*THREE*/</script>
<script>/*DISH*/</script>
<script>/*ENGINE*/</script>
</body>
</html>
